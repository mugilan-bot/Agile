version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: foodflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - IS_LOCAL_MODE=true
      - DATABASE_URL=sqlite:////app/data/foodflow.db
      - SECRET_KEY=foodflow-compose-secret-key-production-ready
    volumes:
      - foodflow-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: foodflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  foodflow-data:
